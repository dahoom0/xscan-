[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xscan"
version = "0.1.0"
description = "XScan — Local AI Security Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["security", "xss", "ai", "automation", "pentesting"]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.0",
    "shellingham>=1.5.0",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.scripts]
xscan = "xscan.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xscan"]

[tool.hatch.build]
include = [
    "src/xscan/**",
    "docs/**",
    "completions/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
